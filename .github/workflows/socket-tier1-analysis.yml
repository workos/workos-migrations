name: Socket Tier 1 Reachability Analysis

on:
  schedule:
    # every day at 12 AM
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Manually run vulnerability analysis'
      distinct_id:
        description: 'Required by the return-dispatch action'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  socket-vulnerability-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check distinct_id
        run: |
          echo "distinct_id: ${{ github.event.inputs.distinct_id }}"
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Route the Socket CLI install through Socket Firewall, then restore public
      # registry access before the scan, which keeps its current registry
      # behavior while reaching the Socket API.
      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}
      - name: Install Socket CLI
        run: npm install -g socket
      - name: Teardown Socket Firewall
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
      - name: Run Tier 1 reachability scan
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_API_KEY }}
        run: |
          # Full application reachability (Tier 1)
          socket scan create . \
            --reach \
            --org "workos" \
            --no-interactive
