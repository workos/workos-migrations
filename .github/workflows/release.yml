name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag name (e.g., v2.0.1)
        type: string
        default: ''
    secrets:
      PUBLIC_SOCKET_FIREWALL_TOKEN:
        description: >-
          Socket Firewall auth token used to route public npm dependency
          downloads. Passed straight to the setup action and never exposed at
          workflow or job scope.
        required: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      # Route the dependency install through Socket Firewall. setup-node runs
      # first so its registry configuration is already in place; the token is
      # passed straight to the action and never surfaced at workflow or job scope.
      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      # Restore public registry access before the build and publication. No
      # dependency download runs after this point: the build is `tsc`, and the
      # publish step uploads to npm over OIDC trusted publishing.
      - name: Teardown Socket Firewall
        uses: workos/setup-socket-firewall/teardown@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1

      - name: Build project
        run: npm run build

      - name: Determine npm tag
        id: npm-tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          if [[ -z "$VERSION" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi

          if [[ "$VERSION" == *"-"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: npm publish --tag ${{ steps.npm-tag.outputs.tag }} --access=public --provenance
